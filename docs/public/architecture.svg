<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="title desc">
  <title id="title">audiobookshelf-mcp architecture</title>
  <desc id="desc">An MCP client talks to audiobookshelf-mcp over stdio. The server exposes 29 read tools and 15 write tools, compacts every response, and calls the Audiobookshelf REST API over HTTPS with a bearer API key. Deleting requires a confirmation token.</desc>

  <!-- SYNC: this file and the inline SVG in docs/index.md show the same diagram.
       This standalone copy uses a prefers-color-scheme media query because the
       README and npm embed it as an image and cannot pass CSS variables in.
       Change both. -->
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.25; }
    .node-accent { fill: rgba(99, 102, 241, 0.12); stroke: #4f46e5; stroke-width: 1.5; }
    .edge { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .edge-accent { stroke: #4f46e5; stroke-width: 1.75; fill: none; }
    .arrow { fill: #94a3b8; }
    .arrow-accent { fill: #4f46e5; }
    text { fill: #1e293b; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .t-title { font-size: 13.5px; font-weight: 600; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .t-muted { fill: #64748b; font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .node { fill: rgba(148, 163, 184, 0.08); stroke: #64748b; }
      .node-accent { fill: rgba(129, 140, 248, 0.14); stroke: #a5b4fc; }
      .edge { stroke: #64748b; }
      .edge-accent { stroke: #a5b4fc; }
      .arrow { fill: #64748b; }
      .arrow-accent { fill: #a5b4fc; }
      text { fill: #dfdfd6; }
      .t-muted { fill: #94a3b8; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="330" />

  <!-- MCP client -->
  <rect class="node" x="14" y="116" width="152" height="88" rx="9" />
  <text class="t-title" x="90" y="150" text-anchor="middle">MCP client</text>
  <text class="t-muted" x="90" y="170" text-anchor="middle">Claude Code · Desktop</text>
  <text class="t-muted" x="90" y="186" text-anchor="middle">Codex · Inspector</text>

  <!-- client -> server -->
  <line class="edge" x1="170" y1="160" x2="244" y2="160" marker-end="url(#a)" />
  <text class="t-mono" x="209" y="146" text-anchor="middle">stdio</text>
  <text class="t-muted" x="209" y="180" text-anchor="middle">no port</text>

  <!-- the server -->
  <rect class="node-accent" x="252" y="26" width="256" height="278" rx="11" />
  <text class="t-title" x="380" y="52" text-anchor="middle">audiobookshelf-mcp</text>

  <rect class="node" x="272" y="70" width="216" height="52" rx="7" />
  <text x="380" y="90" text-anchor="middle">29 read tools</text>
  <text class="t-muted" x="380" y="109" text-anchor="middle">libraries · items · progress · stats</text>

  <rect class="node" x="272" y="134" width="216" height="52" rx="7" />
  <text x="380" y="154" text-anchor="middle">15 write tools</text>
  <text class="t-muted" x="380" y="173" text-anchor="middle">progress · bookmarks · collections</text>

  <rect class="node" x="272" y="198" width="216" height="34" rx="7" />
  <text class="t-muted" x="380" y="219" text-anchor="middle">deletes need a confirmation token</text>

  <text class="t-mono" x="380" y="256" text-anchor="middle">READ_ONLY=true</text>
  <text class="t-muted" x="380" y="275" text-anchor="middle">write tools are never registered</text>
  <text class="t-muted" x="380" y="292" text-anchor="middle">every response compacted, lists capped</text>

  <!-- server -> Audiobookshelf -->
  <line class="edge-accent" x1="512" y1="160" x2="598" y2="160" marker-end="url(#b)" />
  <text class="t-mono" x="557" y="146" text-anchor="middle">HTTPS</text>
  <text class="t-muted" x="557" y="180" text-anchor="middle">bearer API key</text>
  <text class="t-muted" x="557" y="196" text-anchor="middle">no redirects</text>

  <!-- Audiobookshelf -->
  <rect class="node" x="606" y="116" width="180" height="88" rx="9" />
  <text class="t-title" x="696" y="150" text-anchor="middle">Audiobookshelf</text>
  <text class="t-muted" x="696" y="170" text-anchor="middle">2.26.0 or newer</text>
  <text class="t-muted" x="696" y="186" text-anchor="middle">your self-hosted server</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-accent" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
</svg>
